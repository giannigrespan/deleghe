[directories]
# Directory contenente i PDF delle deleghe
pdf_scans = data/pdf_scans

# Directory contenente i file di riepilogo
summary_files = data/summary_files

# Directory per i report di output
output = data/output

[processing]
# Tolleranza per il confronto degli importi (in euro)
amount_tolerance = 0.01

# Formati di output da generare (json, html, text, csv, all)
output_formats = all

# Attiva output dettagliato
verbose = false

[ocr]
# Attiva OCR per PDF scansionati (richiede Tesseract)
enable_ocr = false

# Lingua per OCR (es: ita, eng)
ocr_language = ita

[reporting]
# Includi il testo completo estratto nei report JSON
include_full_text = false

# Dimensione massima del testo da includere (caratteri)
max_text_length = 5000
